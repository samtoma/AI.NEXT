name: CI/CD

# ONE gated pipeline, for ONE solution:
#   build (GitHub-hosted, every branch/PR) → deploy (self-hosted OCI, PDR1-0 only,
#   and currently MANUAL-ONLY — a push does not deploy. See the deploy job.)
# This file is the `PDR1-0` branch's copy. Each solution branch carries its own
# (ADR-0010). Editing this one can never change what another branch deploys.
# Deploy has `needs: build`, so a broken build never reaches the box.
#
# Image hygiene (shared prod box — talent.reletix.com lives here too):
#   build-on-box uses a STABLE tag (ainext-app), so each rebuild leaves exactly one
#   dangling leftover, which we prune. We NEVER use `docker image prune -a` /
#   `system prune` — those would delete other stacks' images. We only remove
#   dangling (untagged) images and cap the build cache.
on:
  push:
    paths:
      - "app/**"
      - "services/extraction/seed/content/**"
      - "deploy/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    paths:
      - "app/**"
  workflow_dispatch: {}

jobs:
  # ---- Stage 1: fast breakage check on GitHub-hosted runners (no secrets, no DB) ----
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit

      # TWO BUILD TARGETS, ONE CODEBASE (ADR-0014). The student build and the
      # admin console differ by `AINEXT_SURFACE`, which decides which files are
      # routes (`pageExtensions`) and where the artefact lands (`distDir`), so
      # they do not clobber each other and both can be checked in one job.
      #
      # Each build is followed by its route-manifest assertion, and that is the
      # gate that matters: FR-2201 says the console's addresses MUST NOT resolve
      # in the student build, and `check:surface` proves it from
      # `app-path-routes-manifest.json` rather than from a runtime `notFound()`.
      # It fails in both directions — a console route leaking into the student
      # build, and a console route missing from the console build — so a green
      # check cannot mean "shipped nothing".
      - name: Build (student surface)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Route manifest — no console routes in the student build (FR-2201)
        run: npm run check:surface

      - name: Build (admin console surface)
        run: npm run build:admin
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Route manifest — every console route present in the console build
        run: npm run check:surface:admin

      # The suite existed for weeks and CI never ran it — including through two
      # edits to this very file. A test suite nobody runs is documentation in a
      # worse format, so this is the gate that gives the other 122 any meaning.
      - name: Tests
        run: npm test

  # ---- The repository is the reference for requirements, so it has to be true.
  #      Fails when a requirement in the active spec has no row, or a row names a
  #      requirement no spec defines. This catches the decay a hand-maintained
  #      matrix cannot catch in review — it was added after exactly that decay
  #      deleted two rows (FR-904, FR-C05) and nobody noticed for three days.
  #
  #      The frozen baseline spec is reported but never gated: failing CI over
  #      shipped history teaches people to reach for --no-verify.
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Requirements traceability
        run: ./scripts/traceability.py --check
      - name: Fail if the generated counts are stale
        run: |
          ./scripts/traceability.py --write >/dev/null
          if ! git diff --quiet -- specs/; then
            echo "::error::The generated counts block is out of date."
            echo "Run ./scripts/traceability.py --write and commit the result."
            git --no-pager diff -- specs/
            exit 1
          fi

  # ---- Stage 2: deploy on the OCI box — ONLY if build passed, ONLY from THIS branch ----
  #
  # ONE BRANCH PER SOLUTION (ADR-0010 + its Clarification, T136).
  # Samuel: "each branch with its own deployment triggers on their own branches."
  #
  # This copy of the workflow lives on `PDR1-0` and deploys the PDR1-0 solution and
  # nothing else. The branch→environment matrix it replaced is gone: there are no
  # ternaries here, because this file has exactly one target.
  #
  #   PDR1-0  →  /opt/reletix/AI.NEXT-mvp1  project ainext-mvp1  :3101
  #
  # Why the paths still say `mvp1`: those name the ENVIRONMENT and its stack, not the
  # branch. `AINEXT_ENVIRONMENT=mvp1` is written into every analytics row, ledger row
  # and cost record already in that database, and the content loader refuses to run
  # against anything else. Renaming the stack would orphan its volume and invalidate
  # the environment tag on existing data for no gain. Branch names changed; the
  # environment did not (ADR-0010: environment naming describes where a build runs).
  #
  # The baseline deploys from ITS OWN branch, using the copy of this workflow on that
  # branch. This file cannot deploy it and must never be given a `main` trigger.
  #
  # ⚠️ ACCEPTED COST of splitting: the shared-box safety rails below (dangling-only
  # pruning, never `system prune`, health gate before traffic) now exist in more than
  # one copy, and the copy that drifts is the one that eventually prunes production's
  # images. If you change a rail here, change it on every solution branch.
  #
  # `concurrency` stays on the SHARED `deploy-oci` group on purpose. The group name is
  # repo-scoped, so it still serialises across branches and workflow files — two
  # solutions sharing one box must never deploy onto it simultaneously.
  # 🔒 DEPLOY IS OPT-IN — Samuel, 2026-09-13: "deployment on infra might come after
  # we finalise and test locally." A push NEVER deploys. The job runs only when you
  # trigger it by hand (Actions → CI/CD → Run workflow, on this branch).
  #
  # This is one condition, not a dismantling: the per-branch structure below is
  # intact. To arm it when the box is ready, change `== 'workflow_dispatch'` back to
  # `!= 'pull_request'` — that single edit is the whole difference (T139).
  #
  # Until then nothing in this repository can reach the OCI box. Note that the first
  # step of this job creates /opt/reletix/AI.NEXT-mvp1 and clones into it BEFORE the
  # secret check fails, so an accidental run is not inert — hence the lock.
  deploy:
    needs: build
    # `main`, since 2026-09-22. `PDR1-0` carried the active line under ADR-0010's
    # one-branch-per-solution rule; Samuel retired that branch and made `main`
    # the single development branch, so the gate follows the code rather than
    # keeping a name nobody pushes to.
    #
    # **Changed in a commit of its own, deliberately.** The fast-forward that
    # moved `main` was pushed while this still read `PDR1-0`, so that push could
    # not deploy anything — a branch move and a change to what deploys are two
    # different decisions and must not arrive together. If they had, 119 commits
    # would have landed on the box in the same breath as the branch rename.
    #
    # `workflow_dispatch` is unchanged and is the important half: no push, no
    # merge and no tag deploys. A deploy is a person pressing a button.
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, oci]
    concurrency:
      group: deploy-oci
      cancel-in-progress: false
    env:
      APP_DIR: /opt/reletix/AI.NEXT-mvp1
      COMPOSE_PROJECT: ainext-mvp1
      COMPOSE_FILE_NAME: docker-compose.mvp1.yml
      APP_PORT: "3101"
      # The admin console is a SECOND PROCESS of the same image, on its own
      # loopback port, so the tunnel can route it to its own hostname and put
      # Cloudflare Access in front of that hostname and not the student one.
      # See deploy/cloudflared-ingress.example.yml — the Access application is a
      # dashboard action and nothing here can prove it exists.
      CONSOLE_PORT: "3102"
    steps:
      - name: Sync code into persistent app dir (git init/fetch — keeps volumes, .env is rewritten next)
        run: |
          set -euo pipefail
          REPO_URL="https://github.com/${{ github.repository }}.git"
          REF="${{ github.ref_name }}"
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"
          if [ ! -d .git ]; then
            git init -q
            git remote add origin "$REPO_URL"
          else
            git remote set-url origin "$REPO_URL"
          fi
          # `--tags` so the RELEASE_TAG step below can find a release tag on the
          # deployed commit. Without it this checkout has branch refs only,
          # `git describe` never matches, and every deploy — including a tagged
          # release — would stamp its turns with the version+sha form.
          git fetch --prune --tags origin "+refs/heads/$REF:refs/remotes/origin/$REF"
          git checkout -f -B "$REF" "origin/$REF"
          git reset --hard "origin/$REF"
          echo "Deploying commit: $(git rev-parse --short HEAD) on $REF"

      # Every `${VAR:?...}` in the compose file must have a value, or compose
      # fails with an interpolation error that names ONE variable and stops —
      # so a half-filled .env is discovered one round trip at a time, at
      # midnight. This step names ALL the missing keys in a single failure.
      #
      # It checks for PRESENCE only and never echoes a value. `set -x` is
      # deliberately not used anywhere in this job for the same reason: these
      # lines are the database passwords and the token signing key.
      # ---------------------------------------------------------------------
      # THE SECRETS COME FROM GITHUB, NOT FROM A FILE SOMEBODY MADE BY HAND.
      # ---------------------------------------------------------------------
      # This step used to REFUSE to deploy unless `deploy/.env` already existed
      # on the box, created once over SSH. Samuel, 2026-09-22: "I want the
      # deployment to be from the CI, why should I run the cmd myself." Fair —
      # and the security argument for the old shape does not survive contact
      # with this box:
      #
      #   the runner is SELF-HOSTED, on the same machine. Anybody who can change
      #   this workflow can already execute arbitrary code there — including
      #   `cat deploy/.env`. Keeping the values out of GitHub therefore bought
      #   almost nothing, while costing a manual step, a second place to rotate
      #   and a file nobody could audit.
      #
      # So GitHub is now the single source of truth and this job writes the file.
      # What that DOES buy is worth stating: rotation is one place, a rebuilt box
      # needs no hand-editing, and the values are no longer only in a directory
      # whose backup story is "there isn't one".
      #
      # WHAT PROTECTS THEM, since they are now reachable from a workflow change:
      #   * they are repository secrets — encrypted at rest, masked in logs, and
      #     never readable back through the API, only overwritten;
      #   * this step NEVER echoes a value. `set -x` appears nowhere in this job;
      #   * the file is written under `umask 077`, so it is 0600 and owned by the
      #     runner user;
      #   * **every secret is validated BEFORE the file is touched.** A missing
      #     one fails the deploy with the names of what is missing and leaves the
      #     previous file exactly as it was. Half-writing an env file is how a
      #     working deployment becomes a broken one at 2am.
      #
      # Set them once (values never appear here, and `gh` does not echo them):
      #   gh secret set POSTGRES_PASSWORD      --repo samtoma/AI.NEXT
      #   gh secret set AINEXT_APP_PASSWORD    --repo samtoma/AI.NEXT
      #   gh secret set AINEXT_OPERATOR_PASSWORD --repo samtoma/AI.NEXT
      #   gh secret set AINEXT_MAINT_PASSWORD  --repo samtoma/AI.NEXT
      #   gh secret set AINEXT_AUTH_SECRET     --repo samtoma/AI.NEXT
      # `AINEXT_CONSOLE_URL` is not a secret — it is a hostname — so it is a
      # plain value here rather than one more thing to keep in two places.
      - name: Write deploy/.env from repository secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AINEXT_APP_PASSWORD: ${{ secrets.AINEXT_APP_PASSWORD }}
          AINEXT_OPERATOR_PASSWORD: ${{ secrets.AINEXT_OPERATOR_PASSWORD }}
          AINEXT_MAINT_PASSWORD: ${{ secrets.AINEXT_MAINT_PASSWORD }}
          AINEXT_AUTH_SECRET: ${{ secrets.AINEXT_AUTH_SECRET }}
          AINEXT_SMTP_URL: ${{ secrets.AINEXT_SMTP_URL }}
          AINEXT_MAIL_FROM: ${{ secrets.AINEXT_MAIL_FROM }}
          AINEXT_GOOGLE_CLIENT_ID: ${{ secrets.AINEXT_GOOGLE_CLIENT_ID }}
          AINEXT_GOOGLE_CLIENT_SECRET: ${{ secrets.AINEXT_GOOGLE_CLIENT_SECRET }}
          AINEXT_GA_MEASUREMENT_ID: ${{ secrets.AINEXT_GA_MEASUREMENT_ID }}
          AINEXT_ALERT_EMAIL: ${{ secrets.AINEXT_ALERT_EMAIL }}
          AINEXT_BOOTSTRAP_OPERATOR_EMAIL: ${{ secrets.AINEXT_BOOTSTRAP_OPERATOR_EMAIL }}
          AINEXT_COURSE_GATING: ${{ vars.AINEXT_COURSE_GATING }}
        run: |
          set -euo pipefail
          # Validate FIRST. Nothing is written until every required value is here.
          missing=""
          for key in POSTGRES_PASSWORD AINEXT_APP_PASSWORD AINEXT_OPERATOR_PASSWORD \
                     AINEXT_MAINT_PASSWORD AINEXT_AUTH_SECRET; do
            eval "v=\${$key:-}"
            [ -n "$v" ] || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::repository secret(s) not set:$missing"
            echo "::error::set each once:  gh secret set <NAME> --repo ${{ github.repository }}"
            echo "::error::deploy/.env.example documents every one of them, and why."
            exit 1
          fi
          # URL-SAFETY GUARD. Compose builds DATABASE_URL and
          # DATABASE_URL_OPERATOR by pasting AINEXT_APP_PASSWORD and
          # AINEXT_OPERATOR_PASSWORD into `postgres://user:PASSWORD@db/...`, and
          # compose cannot percent-encode. A `/`, `?`, `#`, `@`, `:` or `%` in
          # either one produces an invalid URL and an app that dies at its first
          # query — and it only works today because those two happen not to
          # contain one. Refuse that here, loudly and by name, rather than let a
          # future rotation break production in a way whose error points at
          # pg's URL parser instead of at the password.
          for key in AINEXT_APP_PASSWORD AINEXT_OPERATOR_PASSWORD; do
            eval "v=\${$key:-}"
            case "$v" in
              *[/?#@:%]*)
                echo "::error::$key contains a character that breaks a database URL (/ ? # @ : %)."
                echo "::error::Regenerate it URL-safe and deploy again:  openssl rand -hex 32 | gh secret set $key --repo ${{ github.repository }}"
                exit 1 ;;
            esac
          done
          # The console origin is a hostname, not a secret (ADR/TAKEOVER §2.2).
          CONSOLE_URL="https://admin-noor.reletix.com"
          PUBLIC_URL="https://noor.reletix.com"

          ENV_FILE="$APP_DIR/deploy/.env"
          umask 077
          {
            echo "# GENERATED BY CI on $(date -u +%FT%TZ) — do not hand-edit."
            echo "# The source of truth is GitHub repository secrets; a hand edit"
            echo "# here is overwritten by the next deploy. Rotate with \`gh secret set\`."
            for key in POSTGRES_PASSWORD AINEXT_APP_PASSWORD AINEXT_OPERATOR_PASSWORD \
                       AINEXT_MAINT_PASSWORD AINEXT_AUTH_SECRET AINEXT_SMTP_URL \
                       AINEXT_MAIL_FROM AINEXT_GOOGLE_CLIENT_ID AINEXT_GOOGLE_CLIENT_SECRET \
                       AINEXT_GA_MEASUREMENT_ID AINEXT_ALERT_EMAIL \
                       AINEXT_BOOTSTRAP_OPERATOR_EMAIL AINEXT_COURSE_GATING; do
              eval "v=\${$key:-}"
              # SINGLE-QUOTED, ALWAYS. Compose's `.env` parser is not a shell:
              # an unquoted value ends at the first space, and everything after
              # it is read as a new variable name. AINEXT_MAIL_FROM is
              # `"Noor" <admin@noor.reletix.com>` — a perfectly ordinary RFC 5322
              # display name carrying a space, double quotes AND angle brackets —
              # and unquoted it failed the deploy with
              #   line 9: unexpected character "<" in variable name
              # Single quotes are literal to that parser, and the sed escapes any
              # single quote inside the value by closing, escaping and reopening
              # ('"'"' is the standard idiom) so no value can break out of them.
              esc=$(printf '%s' "$v" | sed "s/'/'\\\\''/g")
              [ -n "$v" ] && printf "%s='%s'\n" "$key" "$esc"
            done
            printf "AINEXT_PUBLIC_URL='%s'\n"  "$PUBLIC_URL"
            printf "AINEXT_CONSOLE_URL='%s'\n" "$CONSOLE_URL"
            # The Google redirect ONLY when the other two halves exist. The app
            # treats Google sign-in as all-or-nothing — CLIENT_ID, CLIENT_SECRET
            # and REDIRECT_URI must be all set or all unset — and refuses to
            # render on a half-configured set rather than showing a button that
            # fails. This line used to write the redirect unconditionally, so
            # with Google not yet configured the first real deploy came up with
            # the student app returning 500 on every page:
            #   Google sign-in is partially configured: ... must all be set, or
            #   all be unset (the button then renders disabled).
            # Unset is a SUPPORTED state — the button renders disabled and says
            # so — which is exactly what an unconfigured Google should do.
            if [ -n "${AINEXT_GOOGLE_CLIENT_ID:-}" ] && [ -n "${AINEXT_GOOGLE_CLIENT_SECRET:-}" ]; then
              printf "AINEXT_GOOGLE_REDIRECT_URI='%s/api/auth/google/callback'\n" "$PUBLIC_URL"
            fi
          } > "$ENV_FILE.tmp"
          mv "$ENV_FILE.tmp" "$ENV_FILE"
          chmod 600 "$ENV_FILE"
          # Presence only, never a value.
          echo "wrote $ENV_FILE with $(grep -c '^[A-Z]' "$ENV_FILE") key(s), mode $(stat -c %a "$ENV_FILE")"

      - name: Compute RELEASE_TAG from the deployed commit
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          VERSION="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' app/package.json | head -1)"
          SHA="$(git rev-parse --short HEAD)"
          TAG="$(git describe --tags --exact-match 2>/dev/null || true)"
          RELEASE_TAG="${TAG:-PDR1-0-v${VERSION}+${SHA}}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "deploying $RELEASE_TAG"

      # `up` runs the `migrate` one-shot FIRST, because `app`, `console` and the
      # loader all declare `service_completed_successfully` on it. A migration
      # failure therefore fails this step — the app is never started against a
      # half-migrated database and never sees a request. See
      # deploy/apply-migrations.sh for what it does and which role it uses.
      - name: Build & start (isolated stack — project named explicitly)
        run: |
          set -euo pipefail
          cd "$APP_DIR/deploy"
          # -p is not optional here: with two stacks on one box, an unqualified
          # compose command is how you restart the wrong environment.
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE_NAME" up -d --build --remove-orphans
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE_NAME" ps

      # ALWAYS, and immediately after `up`, whether it passed or failed. A
      # one-shot container's output is the only record of which migrations ran
      # and which check stopped the deploy, and it is gone the next time somebody
      # types `up`. On success this is the boring log nobody reads; on failure it
      # is the whole diagnosis, already in the run record.
      - name: Migration log
        if: always()
        run: |
          cd "$APP_DIR/deploy"
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE_NAME" logs --no-log-prefix migrate || true

      - name: Health check — student surface (127.0.0.1:$APP_PORT)
        run: |
          cd "$APP_DIR/deploy"
          for i in $(seq 1 40); do
            if curl -sSf "http://127.0.0.1:$APP_PORT/" >/dev/null; then
              echo "app healthy on :$APP_PORT ($COMPOSE_PROJECT)"; exit 0
            fi
            sleep 3
          done
          echo "::error::$COMPOSE_PROJECT did not become healthy on :$APP_PORT"
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE_NAME" logs --tail=120 app
          exit 1

      # The console is gated at the edge, not on the box, so from loopback it
      # answers like any other page: `/` redirects an unauthenticated visitor to
      # /signin. `curl -f` treats a 3xx as success, which is what we want — this
      # asks "is the second process serving", not "is it protected". Nothing in
      # CI can answer the second question; deploy/cloudflared-ingress.example.yml
      # is the checklist for it.
      - name: Health check — admin console (127.0.0.1:$CONSOLE_PORT)
        run: |
          cd "$APP_DIR/deploy"
          for i in $(seq 1 40); do
            if curl -sSf "http://127.0.0.1:$CONSOLE_PORT/" >/dev/null; then
              echo "console healthy on :$CONSOLE_PORT ($COMPOSE_PROJECT)"; exit 0
            fi
            sleep 3
          done
          echo "::error::$COMPOSE_PROJECT console did not become healthy on :$CONSOLE_PORT"
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE_NAME" logs --tail=120 console
          exit 1

      # ---------------------------------------------------------------------
      # FIRST BOOT: the operator, then the curriculum. Both gated, both safe to
      # run on every deploy, and neither ever touches a database in use.
      # ---------------------------------------------------------------------
      # The first real deploy came up healthy and EMPTY: no operator, so nobody
      # could sign into admin-noor.reletix.com; no curriculum, so a student who
      # signed up would find nothing to study. Samuel: "I want it from GitHub."
      # Both were things local-dev.sh does and the deploy never did.
      - name: First operator (only when none exists)
        env:
          AINEXT_MAINT_PASSWORD: ${{ secrets.AINEXT_MAINT_PASSWORD }}
          # The three founders, space-separated. Configuration, not a secret.
          # Addresses confirmed from the AI.Next founders' calendar invite
          # (organiser Kamil Sayour; guests Samuel Toma and Tamer Deif), not
          # inferred from the shape of an address. Override with a repository
          # variable of the same name.
          BOOTSTRAP_EMAILS: ${{ vars.AINEXT_BOOTSTRAP_OPERATOR_EMAILS || 'samuel.s.toma@gmail.com t.deifa@gmail.com ksayour@gmail.com' }}
        run: |
          set -euo pipefail
          cd "$APP_DIR/deploy"
          C="docker compose -p $COMPOSE_PROJECT -f $COMPOSE_FILE_NAME"
          N=$($C exec -T db psql -U ainext -d ainext_mvp1 -tAc "select count(*) from operators")
          # GATED ON "NONE", not merely re-run because the script is
          # idempotent: it re-grants each of the four roles if missing, so an
          # ungated run would silently hand back a role an operator had
          # deliberately removed on the next deploy.
          if [ "$N" -gt 0 ]; then
            echo "operators already exist ($N) — not touching them"; exit 0
          fi
          # It SETS NO PASSWORD, on purpose: the operator obtains one through
          # the ordinary reset flow, so no credential sits in a file, a log or a
          # shell history. It runs inside the console container because the
          # image already carries the script and its resolver; maint is handed
          # in for this one command and is never part of the console's own
          # environment.
          # One run per address: the script upserts by lower(email), so each
          # founder gets exactly one operator row however the list is edited.
          # PERCENT-ENCODE the password before it goes inside a URL. The first
          # run of this step failed with `TypeError: Invalid URL`: the role
          # passwords were generated with `openssl rand -base64`, base64 can
          # contain `/`, and a `/` inside the userinfo of a URL ends the
          # authority section. Encoded with the container's own node, so this
          # step needs nothing on the runner beyond docker.
          MAINT_ENC=$($C exec -T -e P="$AINEXT_MAINT_PASSWORD" console \
                        node -e 'process.stdout.write(encodeURIComponent(process.env.P))')
          for email in $BOOTSTRAP_EMAILS; do
            $C exec -T \
              -e DATABASE_URL_MAINT="postgres://ainext_maint:${MAINT_ENC}@db:5432/ainext_mvp1" \
              -e AINEXT_BOOTSTRAP_OPERATOR_EMAIL="$email" \
              console npm run --silent bootstrap:operator
            echo "operator ready: $email"
          done
          echo "Each sets their own password at https://admin-noor.reletix.com/forgot-password"
          echo "— after passing Cloudflare Access, which must list them too."

      - name: Curriculum (only when none is loaded)
        run: |
          set -euo pipefail
          cd "$APP_DIR/deploy"
          C="docker compose -p $COMPOSE_PROJECT -f $COMPOSE_FILE_NAME"
          N=$($C exec -T db psql -U ainext -d ainext_mvp1 -tAc \
                "select count(*) from graph_nodes where kind='course'")
          # A course load REPLACES that course's subtree. On a database with
          # students that would be a content refresh, which has its own manual
          # workflow with a backup first. So this acts ONLY on a database with
          # no course at all — which is to say, only on first boot.
          if [ "$N" -ge 3 ]; then
            echo "curriculum already loaded ($N courses) — not touching it"; exit 0
          fi
          L="$C --profile tools run --rm loader"
          # The same four steps local-dev.sh runs, rehearsed on a scratch
          # database before this was written. Social Studies takes two passes:
          # social-t1 names its book but does not define it, the skeleton does,
          # and a scoped load excludes the skeleton because social-t1
          # supersedes it — so the skeleton goes first to register the book.
          $L --all --course course:prep3-math-en
          $L --all --course course:prep3-arabic-ar
          $L seed/social-skeleton.json --course course:prep3-social-ar
          $L --all --course course:prep3-social-ar
          # What a student will actually get, in the log. Held questions stay
          # held: 297 Arabic ones sit behind the sacred-content gate (ADR-0006)
          # and nothing here promotes them.
          $C exec -T db psql -U ainext -d ainext_mvp1 -c "
            select ns.course_id,
                   count(distinct ns.node_id) as objectives,
                   count(distinct q.id) filter (where q.status='live')   as live,
                   count(distinct q.id) filter (where q.status='review') as held
              from node_subject ns
              left join questions q on q.lo_id = ns.node_id
             group by 1 order by 1"

      # Samuel's decision of 2026-09-23 (constitution v3.2.0, Principle III;
      # ADR-0019): everything in the maths bank is served, generated and
      # unreviewed items included, on the open site, until he says otherwise.
      # Review status is kept exactly as it is in the data and shown in the
      # console only.
      #
      # ONE-TIME, like the curriculum step: it acts only while the generated
      # bank is missing, so a later deploy never reloads over live data and
      # never re-promotes a question somebody has since held back. The bundles
      # are EXPORTS replayed with --restore: every row keeps the status and the
      # review stamp it carries, so nothing asserts a review that did not happen.
      - name: Generated maths content (only when none is loaded)
        run: |
          set -euo pipefail
          cd "$APP_DIR/deploy"
          C="docker compose -p $COMPOSE_PROJECT -f $COMPOSE_FILE_NAME"
          Q() { $C exec -T db psql -U ainext -d ainext_mvp1 -tAc "$1"; }
          GEN=$(Q "select count(*) from questions where source='variant'")
          if [ "$GEN" -ge 590 ]; then
            echo "generated maths content already loaded ($GEN questions) — not touching it"; exit 0
          fi
          PY="$C --profile tools run --rm -e AINEXT_ENVIRONMENT=mvp1 --entrypoint python loader"
          # The catalogue first: a restore refuses to run against an empty one,
          # because every distractor that names an entry would be unknown.
          MC=$(Q "select count(*) from misconceptions")
          if [ "$MC" -lt 90 ]; then
            $PY load_misconceptions.py seed/generated/misconceptions.json
          fi
          for bundle in generated-questions.json widget-questions.json; do
            $PY load_generated_questions.py "seed/generated/$bundle" --restore --sample 0
          done
          # The maths book questions still at 'review' go live WITHOUT a reviewer
          # stamp, so the console still reports them as unreviewed and the
          # decision can be undone exactly (ADR-0019). A materialised inline
          # widget can never be live (CHECK questions_materialised_not_live).
          $C exec -T db psql -U ainext -d ainext_mvp1 -c "
            update questions q set status = 'live'
             where q.status = 'review' and q.materialised_from is null
               and exists (select 1 from node_subject ns
                            where ns.node_id = q.lo_id
                              and ns.course_id = 'course:prep3-math-en')"
          $C exec -T db psql -U ainext -d ainext_mvp1 -c "
            select q.source, q.status,
                   count(*) filter (where q.reviewed_by is null) as unreviewed,
                   count(*) as total
              from questions q join node_subject ns on ns.node_id = q.lo_id
             where ns.course_id = 'course:prep3-math-en'
             group by 1, 2 order by 1, 2"
          echo "misconceptions: $(Q 'select count(*) from misconceptions')"

      # EVERY deploy, unlike the two one-time steps above: the misconception
      # catalogue in the repo is the source of truth, and a fix to it (an
      # explanation written, a duplicate folded in through `aliases`, a
      # distractor re-pointed through `maps`) must reach the site without a
      # manual refresh. The loader is idempotent: it upserts entries and their
      # explanations (never touching the reviewed flag), and it only ever edits
      # the misconception tag on answer choices. It changes no question's
      # status and deletes nothing but an alias the catalogue names.
      - name: Misconception catalogue (every deploy — idempotent)
        run: |
          set -euo pipefail
          cd "$APP_DIR/deploy"
          C="docker compose -p $COMPOSE_PROJECT -f $COMPOSE_FILE_NAME"
          $C --profile tools run --rm -e AINEXT_ENVIRONMENT=mvp1 --entrypoint python loader \
            load_misconceptions.py seed/generated/misconceptions.json
          $C exec -T db psql -U ainext -d ainext_mvp1 -tAc "
            select 'misconceptions: ' || count(*) || ', without an explanation: ' ||
                   count(*) filter (where not exists (
                     select 1 from explanation_library e where e.misconception_id = m.id))
              from misconceptions m"

      - name: Trim dangling images (untagged rebuild leftovers only — talent-safe)
        if: always()
        run: |
          # Removes ONLY untagged (<none>) leftover images from our rebuilds, so the
          # box keeps a single tagged ainext-app. Tagged/running images (talent, mailu,
          # postgres, ...) are untouched. We deliberately do NOT prune the BuildKit
          # build cache here: it is shared across all stacks on this box, and BuildKit's
          # own GC keeps it bounded. Never `-a` / `system prune`.
          docker image prune -f
          echo "Post-deploy ainext images:"
          docker images --format '  {{.Repository}}:{{.Tag}}  {{.Size}}' | grep -i ainext || true
