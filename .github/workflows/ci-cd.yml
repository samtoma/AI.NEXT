name: CI/CD

# ONE gated pipeline:
#   build (GitHub-hosted, every branch/PR) → deploy (self-hosted OCI, main only).
# Deploy has `needs: build`, so a broken build never reaches the box.
#
# Image hygiene (shared prod box — talent.reletix.com lives here too):
#   build-on-box uses a STABLE tag (ainext-app), so each rebuild leaves exactly one
#   dangling leftover, which we prune. We NEVER use `docker image prune -a` /
#   `system prune` — those would delete other stacks' images. We only remove
#   dangling (untagged) images and cap the build cache.
on:
  push:
    paths:
      - "app/**"
      - "services/extraction/seed/content/**"
      - "deploy/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    paths:
      - "app/**"
  workflow_dispatch: {}

jobs:
  # ---- Stage 1: fast breakage check on GitHub-hosted runners (no secrets, no DB) ----
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # ---- Stage 2: deploy on the OCI box — ONLY if build passed, ONLY on main ----
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, oci]
    concurrency:
      group: deploy-oci
      cancel-in-progress: false
    env:
      APP_DIR: /opt/reletix/AI.NEXT
    steps:
      - name: Sync code into persistent app dir (git init/fetch — preserves deploy/.env)
        run: |
          set -euo pipefail
          REPO_URL="https://github.com/${{ github.repository }}.git"
          REF="${{ github.ref_name }}"
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"
          if [ ! -d .git ]; then
            git init -q
            git remote add origin "$REPO_URL"
          else
            git remote set-url origin "$REPO_URL"
          fi
          git fetch --prune origin "+refs/heads/$REF:refs/remotes/origin/$REF"
          git checkout -f -B "$REF" "origin/$REF"
          git reset --hard "origin/$REF"
          echo "Deploying commit: $(git rev-parse --short HEAD) on $REF"

      - name: Verify in-folder secret (deploy/.env)
        run: |
          set -euo pipefail
          ENV_FILE="$APP_DIR/deploy/.env"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE missing. Create it once on the box (self-contained, gitignored):"
            echo "::error::  umask 077; printf 'POSTGRES_PASSWORD=%s\\n' 'STRONG_PW' > $ENV_FILE"
            exit 1
          fi
          grep -Eq '^POSTGRES_PASSWORD=.+' "$ENV_FILE" || { echo "::error::POSTGRES_PASSWORD not set in $ENV_FILE"; exit 1; }
          echo "secret present in $ENV_FILE"

      - name: Build & start (isolated `ainext` stack)
        working-directory: /opt/reletix/AI.NEXT/deploy
        run: |
          set -euo pipefail
          docker compose up -d --build --remove-orphans
          docker compose ps

      - name: Health check (127.0.0.1:3100)
        working-directory: /opt/reletix/AI.NEXT/deploy
        run: |
          for i in $(seq 1 40); do
            if curl -sSf http://127.0.0.1:3100/ >/dev/null; then
              echo "app healthy on :3100"; exit 0
            fi
            sleep 3
          done
          echo "::error::app did not become healthy"
          docker compose logs --tail=120 app
          exit 1

      - name: Trim images & cap build cache (dangling only — never -a, never other stacks)
        if: always()
        run: |
          # Removes only UNTAGGED leftover images (the previous ainext-app build).
          # Tagged/running images — talent, mailu, postgres, etc. — are untouched.
          docker image prune -f
          # Keep the box lean: cap BuildKit cache. Fallbacks guard flag differences.
          docker builder prune -f --max-used-space=2GB \
            || docker builder prune -f \
            || true
          echo "Post-deploy image state:"
          docker images --format '  {{.Repository}}:{{.Tag}}  {{.Size}}' | grep -i ainext || true
          docker system df
