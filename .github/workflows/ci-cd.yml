name: CI/CD

# ONE gated pipeline:
#   build (GitHub-hosted, every branch/PR) → deploy (self-hosted OCI, main only).
# Deploy has `needs: build`, so a broken build never reaches the box.
#
# Image hygiene (shared prod box — talent.reletix.com lives here too):
#   build-on-box uses a STABLE tag (ainext-app), so each rebuild leaves exactly one
#   dangling leftover, which we prune. We NEVER use `docker image prune -a` /
#   `system prune` — those would delete other stacks' images. We only remove
#   dangling (untagged) images and cap the build cache.
on:
  push:
    paths:
      - "app/**"
      - "services/extraction/seed/content/**"
      - "deploy/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    paths:
      - "app/**"
  workflow_dispatch: {}

jobs:
  # ---- Stage 1: fast breakage check on GitHub-hosted runners (no secrets, no DB) ----
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # ---- Stage 2: deploy on the OCI box — ONLY if build passed, ONLY on a deploy branch ----
  #
  # TWO environments share this one job (ADR-0007), mapped by branch:
  #   main → the FROZEN baseline   /opt/reletix/AI.NEXT       project ainext       :3100
  #   mvp1 → the comparison build  /opt/reletix/AI.NEXT-mvp1  project ainext-mvp1  :3101
  #
  # One job rather than two workflows on purpose: the shared-box safety rails
  # (dangling-only pruning, never `system prune`, health gate before traffic) are
  # enforced in exactly one place. A second copy would drift, and the copy that
  # drifts is the one that eventually prunes production's images.
  #
  # The `concurrency` group is deliberately shared, so the two environments never
  # deploy onto the box simultaneously.
  deploy:
    needs: build
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mvp1')
      && github.event_name != 'pull_request'
    runs-on: [self-hosted, oci]
    concurrency:
      group: deploy-oci
      cancel-in-progress: false
    env:
      APP_DIR: ${{ github.ref_name == 'mvp1' && '/opt/reletix/AI.NEXT-mvp1' || '/opt/reletix/AI.NEXT' }}
      COMPOSE_PROJECT: ${{ github.ref_name == 'mvp1' && 'ainext-mvp1' || 'ainext' }}
      COMPOSE_FILE_NAME: ${{ github.ref_name == 'mvp1' && 'docker-compose.mvp1.yml' || 'docker-compose.yml' }}
      APP_PORT: ${{ github.ref_name == 'mvp1' && '3101' || '3100' }}
    steps:
      - name: Sync code into persistent app dir (git init/fetch — preserves deploy/.env)
        run: |
          set -euo pipefail
          REPO_URL="https://github.com/${{ github.repository }}.git"
          REF="${{ github.ref_name }}"
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"
          if [ ! -d .git ]; then
            git init -q
            git remote add origin "$REPO_URL"
          else
            git remote set-url origin "$REPO_URL"
          fi
          git fetch --prune origin "+refs/heads/$REF:refs/remotes/origin/$REF"
          git checkout -f -B "$REF" "origin/$REF"
          git reset --hard "origin/$REF"
          echo "Deploying commit: $(git rev-parse --short HEAD) on $REF"

      - name: Verify in-folder secret (deploy/.env)
        run: |
          set -euo pipefail
          ENV_FILE="$APP_DIR/deploy/.env"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE missing. Create it once on the box (self-contained, gitignored):"
            echo "::error::  umask 077; printf 'POSTGRES_PASSWORD=%s\\n' 'STRONG_PW' > $ENV_FILE"
            exit 1
          fi
          grep -Eq '^POSTGRES_PASSWORD=.+' "$ENV_FILE" || { echo "::error::POSTGRES_PASSWORD not set in $ENV_FILE"; exit 1; }
          echo "secret present in $ENV_FILE"

      - name: Build & start (isolated stack — project named explicitly)
        run: |
          set -euo pipefail
          cd "$APP_DIR/deploy"
          # -p is not optional here: with two stacks on one box, an unqualified
          # compose command is how you restart the wrong environment.
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE_NAME" up -d --build --remove-orphans
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE_NAME" ps

      - name: Health check (127.0.0.1:$APP_PORT)
        run: |
          cd "$APP_DIR/deploy"
          for i in $(seq 1 40); do
            if curl -sSf "http://127.0.0.1:$APP_PORT/" >/dev/null; then
              echo "app healthy on :$APP_PORT ($COMPOSE_PROJECT)"; exit 0
            fi
            sleep 3
          done
          echo "::error::$COMPOSE_PROJECT did not become healthy on :$APP_PORT"
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE_NAME" logs --tail=120 app
          exit 1

      - name: Trim dangling images (untagged rebuild leftovers only — talent-safe)
        if: always()
        run: |
          # Removes ONLY untagged (<none>) leftover images from our rebuilds, so the
          # box keeps a single tagged ainext-app. Tagged/running images (talent, mailu,
          # postgres, ...) are untouched. We deliberately do NOT prune the BuildKit
          # build cache here: it is shared across all stacks on this box, and BuildKit's
          # own GC keeps it bounded. Never `-a` / `system prune`.
          docker image prune -f
          echo "Post-deploy ainext images:"
          docker images --format '  {{.Repository}}:{{.Tag}}  {{.Size}}' | grep -i ainext || true
