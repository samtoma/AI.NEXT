name: Deploy to OCI

# Runs ON the OCI box via a self-hosted runner (labels: self-hosted, oci) that is
# scoped to THIS repo. No inbound SSH; the runner polls GitHub.
#
# Mirrors the TalentReletix deploy model:
#   * the job manages a persistent, pipeline-owned checkout at /opt/reletix/AI.NEXT
#     (git fetch/reset — never a hand-run clone), sitting beside talent/ & talent-preprod/;
#   * builds the app image natively on the box (ARM64) and brings up the isolated
#     `ainext` compose stack next to talent.reletix.com;
#   * persistent state (Claude CLI login, seeded Postgres) lives in NAMED Docker
#     volumes under compose project `ainext`, so it survives every redeploy.
#
# Secrets never touch GitHub and stay self-contained in the app folder:
# POSTGRES_PASSWORD lives in /opt/reletix/AI.NEXT/deploy/.env (gitignored, so the
# git sync below preserves it — `reset --hard` only touches TRACKED files, never
# this untracked .env). Create it once on the box (see deploy/CICD.md).
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "app/**"
      - "services/extraction/seed/content/**"
      - "deploy/**"
      - ".github/workflows/deploy-oci.yml"

concurrency:
  group: deploy-oci
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, oci]
    env:
      APP_DIR: /opt/reletix/AI.NEXT
    steps:
      - name: Sync code into persistent app dir (git init/fetch — preserves deploy/.env)
        run: |
          set -euo pipefail
          REPO_URL="https://github.com/${{ github.repository }}.git"
          REF="${{ github.ref_name }}"
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"
          # git init (not clone) so a pre-placed, gitignored deploy/.env can coexist.
          if [ ! -d .git ]; then
            git init -q
            git remote add origin "$REPO_URL"
          else
            git remote set-url origin "$REPO_URL"
          fi
          git fetch --prune origin "+refs/heads/$REF:refs/remotes/origin/$REF"
          git checkout -f -B "$REF" "origin/$REF"
          git reset --hard "origin/$REF"   # tracked files only — untracked deploy/.env is untouched
          echo "Deploying commit: $(git rev-parse --short HEAD) on $REF"

      - name: Verify in-folder secret (deploy/.env)
        run: |
          set -euo pipefail
          ENV_FILE="$APP_DIR/deploy/.env"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE missing. Create it once on the box (self-contained, gitignored):"
            echo "::error::  umask 077; printf 'POSTGRES_PASSWORD=%s\\n' 'STRONG_PW' > $ENV_FILE"
            exit 1
          fi
          grep -Eq '^POSTGRES_PASSWORD=.+' "$ENV_FILE" || { echo "::error::POSTGRES_PASSWORD not set in $ENV_FILE"; exit 1; }
          echo "secret present in $ENV_FILE"

      - name: Build & start (isolated `ainext` stack)
        working-directory: /opt/reletix/AI.NEXT/deploy
        run: |
          set -euo pipefail
          docker compose up -d --build --remove-orphans
          docker compose ps

      - name: Health check (127.0.0.1:3100)
        working-directory: /opt/reletix/AI.NEXT/deploy
        run: |
          for i in $(seq 1 40); do
            if curl -sSf http://127.0.0.1:3100/ >/dev/null; then
              echo "app healthy on :3100"; exit 0
            fi
            sleep 3
          done
          echo "::error::app did not become healthy"
          docker compose logs --tail=120 app
          exit 1

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
