name: CI

# Fast breakage check on GitHub-hosted runners (no secrets, no DB — every data
# page is force-dynamic so `next build` never connects to Postgres).
on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
