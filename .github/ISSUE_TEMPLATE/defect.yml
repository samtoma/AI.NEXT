name: Defect
description: Something does not do what a requirement says it does.
title: "[bug] "
labels: ["defect", "triage"]
body:
  - type: input
    id: requirement
    attributes:
      label: Which requirement is violated?
      description: "FR id from specs/001-student-mvp1-delta/traceability.md. If none covers it, file a Requirement proposal instead — the gap is the finding."
      placeholder: FR-xxx
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce locally
      description: "Assume ./scripts/local-dev.sh has been run (docs/LOCAL-DEV.md). Exact steps, exact URL."
    validations: { required: true }
  - type: checkboxes
    id: label-check
    attributes:
      label: Status honesty
      options:
        - label: "I checked what traceability.md claims for this FR. If it says VERIFIED and the feature is broken, say so in the body — a wrong label is itself a finding (see FR-205)."
