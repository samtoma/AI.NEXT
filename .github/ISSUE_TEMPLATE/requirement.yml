name: Requirement proposal
description: Propose a new requirement, or a change to one. Feeds the Spec Kit flow.
title: "[req] "
labels: ["requirement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        A requirement says WHAT and WHY, never HOW. Implementation belongs in a plan,
        and architecture decisions belong in an ADR that Samuel approves.
  - type: textarea
    id: statement
    attributes:
      label: The requirement, in one sentence
      description: Write it as an obligation. "The tutor MUST …", "A parent MUST be able to …"
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: Why — what breaks without it?
      description: If nothing breaks, it is an idea rather than a requirement, and that is fine. Say so.
    validations: { required: true }
  - type: textarea
    id: proof
    attributes:
      label: How would we know it works?
      description: The check that would move it to VERIFIED in traceability.md. Be concrete.
    validations: { required: true }
  - type: dropdown
    id: solution
    attributes:
      label: Which solution?
      options:
        - "PDR1-0 — Student MVP (active)"
        - "family-tutor — frozen baseline"
        - "Both"
    validations: { required: true }
  - type: input
    id: supersedes
    attributes:
      label: Does this change an existing requirement?
      placeholder: FR-xxx, or blank
