name: Product feedback
description: Something you saw while using the tutor — good or bad. No code knowledge needed.
title: "[feedback] "
labels: ["feedback", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        This is the main way product feedback enters the repo. It becomes a requirement,
        a defect, or a deliberate "no" — never a lost comment in a chat thread.
  - type: dropdown
    id: surface
    attributes:
      label: Where did you see it?
      options:
        - /student — the study flow
        - /dashboard — where you stand
        - Lesson or chat turn (the tutor talking)
        - A widget (drag/draw question)
        - /admin/content — provenance
        - /spine — the curriculum graph
        - Somewhere else / not sure
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got. A screenshot is worth more than a paragraph.
    validations: { required: true }
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feedback is this?
      options:
        - The teaching was wrong or unhelpful
        - The mathematics was wrong
        - It was confusing to use
        - It was slow or broke
        - An idea for something new
        - Something worked well and should not regress
    validations: { required: true }
  - type: input
    id: requirement
    attributes:
      label: Related requirement (optional)
      description: "If you know it, e.g. FR-205 or FR-301. See specs/001-student-mvp1-delta/traceability.md — leave blank if unsure, triage will find it."
      placeholder: FR-xxx
  - type: dropdown
    id: severity
    attributes:
      label: How much does it matter?
      options:
        - Blocks a student from learning
        - Teaches something incorrect
        - Annoying but workable
        - Polish / nice to have
    validations: { required: true }
