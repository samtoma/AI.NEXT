<!doctype html>
<html lang="en" data-ds="play">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noor review</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--stack-sans), system-ui, sans-serif; font-size: 15px;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    padding: 10px 16px; background: var(--card-warm);
    border-bottom: var(--play-stroke-sm) solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  select, input, textarea, button { font: inherit; color: var(--ink); }
  select, input, textarea {
    background: var(--card); border: var(--play-stroke-sm) solid var(--line);
    border-radius: var(--play-radius-sm); padding: 6px 10px;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: none; box-shadow: var(--noor-focus-ring); }
  button {
    background: var(--card); border: var(--play-stroke-sm) solid var(--line);
    border-radius: var(--play-radius-sm); padding: 6px 12px; cursor: pointer;
    box-shadow: var(--play-shadow-sm);
  }
  button:active { transform: translate(2px, 2px); box-shadow: none; }
  button:disabled { color: var(--play-disabled-text); border-color: var(--play-disabled-border); box-shadow: none; cursor: not-allowed; }
  button.confirm { background: var(--noor-progress); color: var(--noor-on-progress); }
  button.dispute { background: var(--noor-action); color: var(--noor-on-action); }
  .grow { flex: 1; }
  .muted { color: var(--ink-soft); }
  .progress { min-width: 200px; }
  .bar { height: 10px; background: var(--paper-deep); border: var(--play-stroke-sm) solid var(--line); border-radius: var(--play-radius-pill); overflow: hidden; }
  .bar > div { height: 100%; background: var(--noor-progress); }
  main { display: grid; grid-template-columns: 300px minmax(0, 1fr) minmax(0, 1fr); height: calc(100% - 108px); }
  header h1 { cursor: pointer; }
  #tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 16px; border-bottom: var(--play-stroke-sm) solid var(--line-soft); }
  #tools:empty { display: none; }
  .crumb { color: var(--ink-soft); }
  .home { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  .home h2 { margin: 0 0 4px; }
  .group { margin-top: 22px; }
  .group h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); margin: 0 0 8px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .task { background: var(--card); border: var(--play-stroke) solid var(--line); border-radius: var(--play-radius); box-shadow: var(--play-shadow); padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 8px; }
  .task:not(:disabled):hover { background: var(--accent-wash); }
  .task .n { font-size: 30px; font-weight: 800; }
  .task .n small { font-size: 15px; font-weight: 400; color: var(--ink-soft); }
  .task .t { font-size: 18px; font-weight: 700; }
  .vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
  .vs > div { border: var(--play-stroke-sm) solid var(--line); border-radius: var(--play-radius-sm); padding: 10px 12px; overflow-wrap: anywhere; }
  .vs b { font-size: 18px; display: block; margin-top: 4px; }
  .vs .printed { background: var(--gold-wash); }
  .vs .meant { background: var(--accent-wash); }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); }
  .why { border-left: 4px solid var(--line); padding-left: 10px; margin: 8px 0; }
  .gen { border-left: 4px solid var(--noor-action); padding-left: 10px; margin: 12px 0 8px; }
  .gen ol, .why ol { margin: 4px 0; padding-left: 20px; }
  .subtabs { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .subtabs button { font-size: 12px; padding: 2px 10px; border-radius: var(--play-radius-pill); box-shadow: none; }
  .subtabs button.on { background: var(--ink); color: var(--paper); }
  #list h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); margin: 14px 6px 4px; }
  .pane { overflow: auto; padding: 12px 16px; }
  #list { border-right: var(--play-stroke-sm) solid var(--line-soft); padding: 8px; }
  #list h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); margin: 14px 6px 4px; }
  .rec {
    display: flex; gap: 8px; align-items: center; width: 100%; text-align: left;
    padding: 6px 8px; border: 0; border-radius: var(--play-radius-sm); box-shadow: none; background: transparent;
  }
  .rec:active { transform: none; }
  .rec.sel { background: var(--accent-wash); }
  .rec .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; font-size: 13px; }
  .dot {
    flex: none; min-width: 26px; text-align: center; font-size: 11px; font-weight: 700;
    border: var(--play-stroke-sm) solid var(--line); border-radius: var(--play-radius-pill); padding: 1px 4px;
  }
  .s-none { background: var(--paper-deep); color: var(--ink); }
  .s-one { background: var(--card-warm); color: var(--ink); }
  .s-done { background: var(--noor-progress); color: var(--noor-on-progress); }
  .s-disp { background: var(--noor-action); color: var(--noor-on-action); }
  .card {
    background: var(--card); border: var(--play-stroke) solid var(--line);
    border-radius: var(--play-radius); box-shadow: var(--play-shadow); padding: 16px; margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 4px; font-size: 18px; }
  .quote { font-size: 17px; background: var(--card-warm); border-radius: var(--play-radius-sm); padding: 8px 12px; margin: 10px 0; }
  .warn { background: var(--gold-wash); color: var(--play-text-amber-warm); border-radius: var(--play-radius-sm); padding: 8px 12px; margin: 10px 0; }
  dl { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; margin: 0; }
  dt { color: var(--ink-soft); font-size: 13px; padding-top: 2px; }
  dd { margin: 0; overflow-wrap: anywhere; }
  dd ul, dd ol { margin: 0; padding-left: 18px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; border-bottom: var(--play-stroke-sm) solid var(--line-soft); padding: 4px 6px; vertical-align: top; }
  .tag { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: var(--play-radius-pill); border: var(--play-stroke-sm) solid var(--line); }
  a.ref { color: var(--play-text-link); cursor: pointer; text-decoration: underline; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .who { font-size: 13px; margin-top: 10px; }
  form.flag-form { display: none; margin-top: 12px; gap: 8px; flex-direction: column; }
  form.flag-form.open { display: flex; }
  .edit-row { display: grid; grid-template-columns: 140px 1fr 32px; gap: 8px; align-items: start; margin-bottom: 8px; }
  .edit-row label { color: var(--ink-soft); font-size: 13px; padding-top: 8px; overflow-wrap: anywhere; }
  .edit-row textarea, .edit-row input, .edit-row select { width: 100%; }
  .edit-row .x { padding: 4px 0; }
  textarea.json { font-family: var(--stack-mono), monospace; font-size: 13px; }
  .part { border-top: var(--play-stroke-sm) solid var(--line-soft); padding: 8px 0; }
  .part:first-child { border-top: 0; padding-top: 0; }
  .sub { margin-top: 6px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  ul.answers { margin: 4px 0 0; padding-left: 18px; }
  ul.answers li { margin-bottom: 4px; }
  .err { color: var(--play-text-amber-warm); background: var(--gold-wash); border-radius: var(--play-radius-sm); padding: 6px 10px; margin-top: 8px; }
  #pdfbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  #pdfbar input { width: 70px; }
  #canvas { width: 100%; border: var(--play-stroke-sm) solid var(--line); border-radius: var(--play-radius-sm); background: var(--card); }
  table.printed { width: auto; margin-top: 4px; }
  table.printed th, table.printed td { border: var(--play-stroke-sm) solid var(--line-soft); }
  table.printed th { background: var(--card-warm); }
  .kbd { font-family: var(--stack-mono), monospace; font-size: 12px; }
  /* Figures: the book's crop beside S4's drawing */
  .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 10px 0; align-items: start; }
  .figs > div { border: var(--play-stroke-sm) solid var(--line); border-radius: var(--play-radius-sm); padding: 8px 10px; background: var(--card); min-width: 0; overflow-wrap: anywhere; }
  .figs .book { background: var(--card-warm); }
  .figs img { max-width: 100%; display: block; margin: 6px auto 0; background: var(--card); border-radius: var(--play-radius-sm); }
  pre.spec { white-space: pre-wrap; font-family: var(--stack-mono), monospace; font-size: 12px; margin: 4px 0 0; }
  svg.viz { width: 100%; height: auto; display: block; margin-top: 6px; }
  svg.viz * { vector-effect: non-scaling-stroke; stroke-width: var(--play-stroke-sm); }
  svg.viz .grid { stroke: var(--line-soft); }
  svg.viz .axis { stroke: var(--ink-soft); }
  svg.viz .curve, svg.viz .arrow, svg.viz .seg { stroke: var(--accent); fill: none; }
  svg.viz .arrowhead, svg.viz .pt { fill: var(--accent); stroke: none; }
  svg.viz .mark { fill: var(--noor-action); stroke: none; }
  svg.viz .guide { stroke: var(--ink-faint); stroke-dasharray: 4 3; fill: none; }
  svg.viz .pill { fill: var(--card); stroke: var(--line); }
  svg.viz .set { fill: none; stroke: var(--line-soft); }
  svg.viz text { fill: var(--ink); stroke: none; font-family: var(--stack-mono), monospace; font-size: 10px; }
  svg.viz text.tick { fill: var(--ink-faint); font-size: 8px; }
  svg.viz text.head { fill: var(--ink-soft); font-weight: 700; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; height: auto; }
    #list { max-height: 40vh; border-right: 0; }
  }
</style>
</head>
<body>
<header>
  <h1 id="homelink" title="All tasks">Noor review</h1>
  <span id="crumb" class="crumb"></span>
  <span class="grow"></span>
  <span id="saved" class="muted"></span>
  <label>Your initials <input id="me" size="4" maxlength="6" placeholder="e.g. TD"></label>
</header>
<div id="tools"></div>
<div id="home" class="home" hidden></div>
<main id="work" hidden>
  <nav id="list" class="pane" aria-label="Records"></nav>
  <section id="detail" class="pane"></section>
  <section class="pane">
    <div id="pdfbar">
      <button id="prev" aria-label="Previous page">‹</button>
      <span>printed p.</span><input id="pg" type="number">
      <button id="next" aria-label="Next page">›</button>
      <span id="pdfinfo" class="muted"></span>
    </div>
    <canvas id="canvas"></canvas>
  </section>
</main>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $ = (s) => document.querySelector(s);
const today = () => new Date().toISOString().slice(0, 10);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const meNow = () => $("#me").value.trim();

let path = null, data = null, records = [], idx = 0, offset = 0, pdf = null, pdfPath = null, page = 1, rendering = null, editing = false;
// Label extraction: the lesson open, its ground truth (null until the first label), and whether the records come from an
// extraction file (labels are then written into the ground truth) or from the ground truth itself (edited in place).
let view = "home", lessonRow = null, gtDoc = null, extMode = false, notInBook = [];
const getJSON = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(await r.text()); return r.json(); };

/* ---------- sections and kinds ---------- */
// [section title, path in the file, single object?]
const SECTIONS = [
  ["Lesson", "lesson", true],
  ["Items", "items"],
  ["Learning objectives", "learning_objectives"],
];
const ITEM_TYPES = ["printed_objective", "key_term", "definition", "rule", "caution", "convention", "method", "open_prompt",
  "worked_example", "exercise", "activity", "figure", "table", "heading", "linking_text", "prior_knowledge"];
const KINDS = [...ITEM_TYPES, "learning_objective"];
const MOVABLE = new Set(["items", "learning_objectives"]);
// the field that holds a record's main text, by kind (names follow the extraction data)
const MAIN = (k) => ({ definition: "claim", rule: "claim", caution: "claim", convention: "claim", method: "claim", key_term: "term", figure: "caption", table: "caption",
  worked_example: "stem", learning_objective: "description" }[k] || "text");
const kindOf = (sec, r) => sec === "learning_objectives" ? "learning_objective" : r.type;
const sectionOfKind = (k) => k === "learning_objective" ? "learning_objectives" : "items";

function getAt(p, create) {
  let o = data; const parts = p.split(".");
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] ||= {};
  const last = parts.at(-1);
  if (create && o[last] === undefined) o[last] = [];
  return o[last];
}
const byId = () => Object.fromEntries([...(data.items || []), ...(data.learning_objectives || [])].map((r) => [r.id, r]));
const short = (id) => String(id || "").split(":").pop();

function titleOf(sec, r) {
  switch (sec) {
    case "lesson": return `${r.syllabus_ref || ""} ${r.title || ""}`;
    case "items": return `${r.type} · ${short(r.id)}`;
    case "learning_objectives": return r.label || short(r.id);
    default: return r.text || "";
  }
}
function pageOf(sec, r) {
  const ids = byId(), seen = new Set();
  const pg = (id) => { if (!id || seen.has(id)) return null; seen.add(id); const x = ids[id]; return x?.source_page ?? (x?.evidence ? pg([].concat(x.evidence)[0]) : null); };
  if (r.source_page) return r.source_page;
  if (sec === "lesson") return r.pages?.[0];
  if (sec === "learning_objectives") return pg(r.evidence?.[0]);
  return pg(r.lo);
}
function build() {
  records = [];
  for (const [, p, single] of SECTIONS) {
    const v = getAt(p);
    if (single) { if (v) records.push({ sec: p, r: v }); }
    else (v || []).forEach((r) => records.push({ sec: p, r }));
  }
}
const SEC_TITLE = Object.fromEntries(SECTIONS.map(([t, p]) => [p, t]));

/* ---------- review state (one reviewer) ---------- */
const status = (r) => r.review?.status || null;
const edited = (r) => (r.review?.edits || []).length > 0;
const hasMisprints = (r) => (r.misprints || []).length > 0 || (r.parts || []).some((p) => (p.misprints || []).length > 0);
const isExtraction = () => data?.role === "extraction";

/* ---------- list ---------- */
function visible() {
  const f = $("#filter").value;
  return records.map((x, i) => ({ ...x, i })).filter(({ r }) =>
    f === "all" ? true : f === "todo" ? !status(r) : f === "flagged" ? status(r) === "flagged"
      : f === "misprints" ? hasMisprints(r) : edited(r));
}
function renderList() {
  const el = $("#list"); el.innerHTML = "";
  let last = null;
  for (const { sec, r, i } of visible()) {
    if (sec !== last) { el.insertAdjacentHTML("beforeend", `<h3>${esc(SEC_TITLE[sec])}</h3>`); last = sec; }
    const s = status(r);
    const cls = s === "confirmed" ? "s-done" : s === "flagged" ? "s-disp" : "s-none";
    const label = s === "confirmed" ? "✓" : s === "flagged" ? "!" : "·";
    const b = document.createElement("button");
    b.className = "rec" + (i === idx ? " sel" : "");
    b.innerHTML = `<span class="dot ${cls}" title="${s || "not reviewed"}">${label}</span><span class="t">${esc(titleOf(sec, r))}</span>${edited(r) ? '<span class="muted" title="edited">✎</span>' : ""}`;
    b.onclick = () => select(i);
    el.appendChild(b);
  }
  const done = records.filter(({ r }) => status(r) === "confirmed").length;
  const flagged = records.filter(({ r }) => status(r) === "flagged").length;
  $("#barfill").style.width = `${records.length ? (100 * done) / records.length : 0}%`;
  $("#ptext").textContent = `${done}/${records.length} confirmed · ${flagged} flagged`;
}

/* ---------- read view ---------- */
const HIDE = new Set(["review", "provenance", "id", "header", "rows", "misprints"]);
function tableBlock(r) {
  if (!r.rows) return "";
  const head = r.header ? `<tr>${r.header.map((h) => `<th>${esc(h)}</th>`).join("")}</tr>` : "";
  return `<table class="printed">${head}${r.rows.map((row) => `<tr>${row.map((c, j) => j === 0 ? `<th>${esc(c)}</th>` : `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`;
}
const misprintBlock = (ms, where) => (ms || []).map((m) => `<div class="warn"><b>Misprint</b>${where ? " in part " + esc(where) : ""}, ${esc(m.field)}: printed <b>${esc(m.printed)}</b>, meant <b>${esc(m.intended)}</b>${m.notes ? `<div>${esc(m.notes)}</div>` : ""}</div>`).join("");
function value(k, v, ids) {
  if (v === null || v === undefined || v === "") return '<span class="muted">—</span>';
  if (typeof v === "string") return ids[v] ? `<a class="ref" data-id="${esc(v)}">${esc(v)}</a>` : esc(v);
  if (typeof v !== "object") return esc(v);
  if (k === "parts" && Array.isArray(v)) return v.map((p) => partBlock(p, ids)).join("");
  if (Array.isArray(v)) return `<ol>${v.map((x) => `<li>${value(k, x, ids)}</li>`).join("")}</ol>`;
  return `<dl>${Object.entries(v).map(([a, b]) => `<dt>${esc(a)}</dt><dd>${value(a, b, ids)}</dd>`).join("")}</dl>`;
}

const prov = (x) => `<span class="tag">${esc(x)}</span>`;
function partBlock(p, ids) {
  const rest = Object.entries(p).filter(([k]) => !["label", "stem", "answer", "solution_provenance", "misprints"].includes(k));
  return `<div class="part">
    <div><b>${esc(p.label ?? "")}</b> ${p.stem ? esc(p.stem) : ""}</div>
    ${p.answer != null ? `<div>Answer: <b>${esc(p.answer)}</b> ${p.solution_provenance ? prov(p.solution_provenance) : ""}</div>` : '<div class="muted">No answer printed</div>'}
    ${rest.map(([k, x]) => `<div class="muted">${esc(k)}: ${value(k, x, ids)}</div>`).join("")}
    ${misprintBlock(p.misprints, p.label)}
  </div>`;
}

function renderDetail() {
  const el = $("#detail");
  if (!records.length) { el.innerHTML = renderFileCard(); bindFileCard(); return; }
  const { sec, r } = records[idx], ids = byId(), me = meNow();
  const v = r.review || {};
  const head = `<div class="muted">${esc(SEC_TITLE[sec])} · ${idx + 1} of ${records.length}${r.id ? " · " + esc(r.id) : ""}</div>
      <h2>${esc(titleOf(sec, r))}</h2>`;
  if (editing) { el.innerHTML = `<div class="card">${head}${editForm(sec, r)}</div>${renderFileCard()}`; bindEdit(sec, r); bindFileCard(); return; }
  const fields = Object.entries(r).filter(([k]) => !HIDE.has(k) && k !== "quote");
  el.innerHTML = `
    <div class="card">
      ${head}
      ${r.quote ? `<div class="quote">“${esc(r.quote)}”</div><div class="muted">Find these words on the page, then check everything below against the book.</div>`
        : r.anchor ? `<div class="quote">Anchor ${esc(r.anchor)}</div><div class="muted">The extractor located this by its own reference, with no quote. Find it on the page, then check everything below against the book.</div>` : ""}
      ${isExtraction() && hasMisprints(r) ? '<div class="muted">The extractor proposes the misprint(s) below. Confirming this record confirms them; if one is wrong, edit or flag the record.</div>' : ""}
      <dl style="margin-top:12px">${fields.map(([k, x]) => `<dt>${esc(k)}</dt><dd>${value(k, x, ids)}</dd>`).join("")}${r.rows ? `<dt>table</dt><dd>${tableBlock(r)}</dd>` : ""}</dl>
      ${misprintBlock(r.misprints)}
      <div class="who">
        ${r.provenance?.by ? `<div class="muted">Drafted by ${esc(r.provenance.by)}</div>` : ""}
        ${v.status === "confirmed" ? `<b>Confirmed</b> by ${esc(v.by)} on ${esc(v.at)}` : v.status === "flagged" ? `<div class="warn"><b>Flagged</b> by ${esc(v.by)} on ${esc(v.at)}: ${esc(v.reason || "")}</div>` : "Not reviewed yet"}
        ${(v.edits || []).map((e) => `<div class="muted">✎ ${esc(e.by)}, ${esc(e.at)}: ${esc(e.fields.join(", "))}</div>`).join("")}
      </div>
      <div class="actions">
        <button class="confirm" id="bconfirm" ${!me || v.status === "confirmed" ? "disabled" : ""}>Confirm (c)</button>
        <button id="bedit" ${!me ? "disabled" : ""}>Edit (e)</button>
        <button id="bmis" ${!me || !MOVABLE.has(sec) ? "disabled" : ""}>Misprint (m)</button>
        <button class="dispute" id="bflag" ${!me ? "disabled" : ""}>Flag (f)</button>
        <button id="bundo" ${!v.status ? "disabled" : ""}>Undo (u)</button>
        <span class="grow"></span>
        <button id="bprev">‹ Prev (k)</button><button id="bnext">Next (j) ›</button>
      </div>
      ${!me ? '<div class="muted" style="margin-top:8px">Type your initials at the top to review.</div>' : ""}
      ${MOVABLE.has(sec) ? misprintForm(r) : ""}
      <form class="flag-form" id="fform">

// an extraction file with the ground truth laid over it, so the reviewer sees each record once, in its latest state.
// `match` pairs an extracted id with the ground-truth id of the same printed thing when they differ (the scorer's
// content match): the ground truth's record and its frozen id win. An unmatched extracted record whose id the ground
// truth already uses for something else gets the next free id of its type, so nothing is overwritten.
function overlay(ext, gt, match = {}) {
  const d = structuredClone(ext);
  const g = Object.fromEntries([...(gt?.items || []), ...(gt?.learning_objectives || [])].map((r) => [r.id, r]));
  notInBook = structuredClone(gt?.not_in_book || []);
  const gone = new Set(notInBook.map((n) => n.id));
  const used = new Set([...Object.keys(g), ...[...(d.items || []), ...(d.learning_objectives || [])].map((r) => r.id)]);
  const fresh = (r) => {
    const base = `${r.id.split(":")[0]}:${String(r.type || "objective").replace(/_/g, "-")}`;
    let n = 1; while (used.has(`${base}-${n}`)) n++;
    used.add(`${base}-${n}`); return `${base}-${n}`;
  };
  for (const sec of ["items", "learning_objectives"]) {
    const shown = new Set();
    d[sec] = (d[sec] || []).filter((r) => !gone.has(r.id)).map((r) => {
      const gid = match[r.id] || r.id;
      if (g[gid] && !shown.has(gid)) { shown.add(gid); return structuredClone(g[gid]); }
      if (g[r.id] || shown.has(r.id)) return { ...r, id: fresh(r) }; // the id is the ground truth's for another record
      return r;
    });
    for (const r of gt?.[sec] || []) if (!shown.has(r.id) && !gone.has(r.id)) d[sec].push(structuredClone(r)); // only the ground truth has it
  }
  if (gt?.lesson?.review) d.lesson.review = gt.lesson.review;
  return d;
}
async function openLesson(row) {
  lessonRow = row; store.set("rv-lesson", `${row.book}|${row.slug}`);
  gtDoc = row.gt ? await getJSON(`/api/file?path=${encodeURIComponent(row.gt)}`) : null;
  extMode = !!row.ext; notInBook = [];
  if (extMode) {
    const match = row.gt ? await getJSON(`/api/lesson-match?ext=${encodeURIComponent(row.ext)}&gt=${encodeURIComponent(row.gt)}`) : {};
    data = overlay(await getJSON(`/api/file?path=${encodeURIComponent(row.ext)}`), gtDoc, match);
    path = row.ext;

  $("#role").title = extMode ? "Records come from the pipeline's book record; what you label is written into the ground truth."

  // book record v1 stores the offset as a number; older files had "pdf_page = printed_page + 1"
  const po = data.source_document?.page_offset;

}

    ...(s.segments?.length ? [`segments: ${s.segments.map(([a, b]) => `${a}–${b}`).join(", ")}`] : []),

// "(1, -3)" in a label → [1, -3]: the point the label says it is
const labelPoint = (label) => { const m = /\(\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*\)/.exec(String(label || "").replace(/−/g, "-")); return m ? [Number(m[1]), Number(m[2])] : null; };

  let g = grid + `<polyline class="curve" points="${xs.map((x, i) => `${sx(x)},${sy(ys[i])}`).join(" ")}"/>`;

  if (rv.has("vertex") && vx != null) g += `<circle class="mark" cx="${sx(vx)}" cy="${sy(f(vx))}" r="4"/>`;
  for (const m of mk) g += `<circle class="pt" cx="${sx(m.x)}" cy="${sy(m.y)}" r="3.5"/>${m.label ? `<text x="${sx(m.x) + 5}" y="${sy(m.y) - 5}">${esc(m.label)}</text>` : ""}`;
  const term = (a, v, first) => (a === 0 ? "" : `${a < 0 ? (first ? "−" : " − ") : first ? "" : " + "}${Math.abs(a) === 1 && v ? "" : fmt(Math.abs(a))}${v}`);

    `marker(s) at f(x): ${mk.map((m) => `(${fmt(m.x)}, ${fmt(m.y)})${m.label ? ` labelled ${esc(m.label)}` : ""}`).join(", ") || "none"}`,

const PREVIEW = { arrow_map: previewArrowMap, coordinate_plot: previewPlot, function_graph: previewGraph };

  try {

async function showGenItem(g) {

  $("#detail").innerHTML = `<div class="card">
    <div class="muted">${esc(GKIND[d.kind])} · ${esc(book)} · ${esc(g.lesson)} · <span style="font-family:var(--stack-mono),monospace;font-size:12px">${esc(d.ref)}</span>${d.item.status ? ` · ${esc(d.item.status)} for students` : ""}</div>

      <label>Suggested correction (optional) <textarea id="gcorr" rows="2" style="width:100%"></textarea></label>
      <div class="actions"><button class="confirm" type="submit">Record: needs fix</button><button type="button" id="gcancel">Cancel</button></div>
    </form>

  renderMathInElement($("#detail"), { delimiters: [{ left: "$", right: "$", display: false }], throwOnError: false });

function openGenFix() { if (!meNow() || !$("#gform")) return; $("#gform").classList.add("open"); $("#gnote").focus(); }

/* ---------- boot ---------- */
$("#me").value = store.get("gt-me") || "";
$("#me").oninput = () => { store.set("gt-me", meNow()); if (view === "label") renderAll(); else if (view === "misprints") renderMp(false); else if (view === "generated" && gi >= 0) showGenItem(gen[gi]); else if (view === "answers" && ai >= 0) showAnswer(ans[ai]); else if (view === "tiers" && ti >= 0) showTier(tiersRows[ti]); else if (view === "objectives" && oi >= 0) showObjective(objRows[oi]); else if (view === "maths" && mri >= 0) showMaths(mrRows[mri]); };

  if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName) || editing || e.metaKey || e.ctrlKey) return;
  if (view === "misprints") {

    else if (e.key === "c" && !$("#mc")?.disabled) decide("confirmed");

  }
  if (view === "answers") {
    if (e.key === "j") ansMove(1); else if (e.key === "k") ansMove(-1);

    return;

  if (view === "objectives") {

    else if (e.key === "1" && meNow()) mathsDecide("first");
    else if (e.key === "2" && meNow() && mrRows[mri]) mathsDecide("second");

    return;
  }
  if (view === "tiers") {
    if (e.key === "j") tierMove(1); else if (e.key === "k") tierMove(-1);
    else if (TIER_KEYS[e.key] && meNow()) tierDecide(TIER_KEYS[e.key]);
    return;
  }

    if (e.key === "j") genMove(1); else if (e.key === "k") genMove(-1);
    else if (e.key === "a" && meNow()) genDecide("approve");
    else if (e.key === "f") { e.preventDefault(); openGenFix(); }
    else if (e.key === "x" && meNow()) genDecide("reject");
    return;
  }
  if (view !== "label") return;
  if (e.key === "j") move(1); else if (e.key === "k") move(-1);
  else if (e.key === "c") confirm_(); else if (e.key === "f") { e.preventDefault(); openFlag(); }
  else if (e.key === "e") { e.preventDefault(); startEdit(); }
  else if (e.key === "u") undo();
  else if (e.key === "m") { e.preventDefault(); openMisprint(); }
});
