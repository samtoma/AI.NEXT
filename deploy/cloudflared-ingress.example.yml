# Expose the tutor at ainext.reletix.com — THIS tunnel is TOKEN-MANAGED
# ============================================================================
# The cloudflared on this box runs as a CONTAINER with a TUNNEL_TOKEN
# (/opt/reletix/infrastructure/cloudflared, network_mode: host). Ingress is
# therefore managed in the Cloudflare Zero Trust DASHBOARD, NOT a local
# config.yml. `cloudflared tunnel route dns` and `systemctl reload cloudflared`
# do NOT apply here — there is nothing to edit on disk.
#
# ---- To expose the tutor (additive; talent's hostnames stay untouched) ----
#   Zero Trust -> Networks -> Tunnels -> <the talent tunnel> -> Public Hostname -> Add:
#     Subdomain: ainext
#     Domain:    reletix.com
#     Path:      (empty)
#     Type:      HTTP            # NOT HTTPS
#     URL:       localhost:3100  # host-network cloudflared reaches the app on loopback
#   Save -> DNS auto-created -> the connector hot-reloads (no restart).
#
# ---- Then LOCK it (only named people get in) ----
#   Zero Trust -> Access -> Applications -> Add application -> Self-hosted:
#     hostname ainext.reletix.com ; policy Allow -> Include -> Emails: <allow-list>
#   (Create from a clean .../apps/self-hosted/add — the wizard's private-IP
#    template otherwise 400s a public app on use_clientless_isolation_app_launcher_url.)
#
# ============================================================================
# FALLBACK ONLY — if you EVER switch this to a locally-managed (config.yml)
# tunnel, the equivalent ingress would be:
#
# ingress:
#   - hostname: ainext.reletix.com
#     service: http://localhost:3100
#   # ... existing talent.reletix.com rules stay exactly as they are ...
#   - service: http_status:404          # catch-all MUST stay last
#
# then:  cloudflared tunnel route dns <TUNNEL_NAME> ainext.reletix.com
